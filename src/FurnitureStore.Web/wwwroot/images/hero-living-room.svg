<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Minh họa phòng khách với sofa gỗ, đèn đứng và cây xanh</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ebe0"/>
      <stop offset="1" stop-color="#e6d7c3"/>
    </linearGradient>
    <linearGradient id="sofaBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99d70"/>
      <stop offset="1" stop-color="#a97a4c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7bd" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffe7bd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- arched wall -->
  <path d="M110 472 V230 a210 210 0 0 1 420 0 V472 Z" fill="url(#wall)"/>

  <!-- window -->
  <path d="M252 300 V196 a68 68 0 0 1 136 0 V300 Z" fill="#fbf8f3" stroke="#d6c3aa" stroke-width="6"/>
  <line x1="320" y1="128" x2="320" y2="300" stroke="#d6c3aa" stroke-width="4"/>
  <line x1="252" y1="222" x2="388" y2="222" stroke="#d6c3aa" stroke-width="4"/>

  <!-- floor and rug -->
  <rect x="30" y="470" width="580" height="6" rx="3" fill="#d6c3aa"/>
  <ellipse cx="320" cy="474" rx="240" ry="15" fill="#e3d1b8"/>

  <!-- sofa -->
  <rect x="150" y="332" width="340" height="82" rx="30" fill="url(#sofaBack)"/>
  <rect x="140" y="388" width="360" height="56" rx="22" fill="#b8875a"/>
  <rect x="116" y="354" width="58" height="92" rx="26" fill="#a0714a"/>
  <rect x="466" y="354" width="58" height="92" rx="26" fill="#a0714a"/>
  <rect x="188" y="348" width="124" height="52" rx="20" fill="#d9b48c"/>
  <rect x="328" y="348" width="124" height="52" rx="20" fill="#d9b48c"/>
  <rect x="210" y="326" width="56" height="48" rx="14" fill="#f1e5d4" transform="rotate(-9 238 350)"/>
  <rect x="376" y="330" width="50" height="44" rx="14" fill="#7f9270" transform="rotate(7 401 352)"/>
  <rect x="160" y="444" width="10" height="28" rx="3" fill="#5b3a24"/>
  <rect x="470" y="444" width="10" height="28" rx="3" fill="#5b3a24"/>

  <!-- side table with lamp -->
  <circle cx="576" cy="318" r="62" fill="url(#glow)"/>
  <rect x="540" y="402" width="72" height="10" rx="4" fill="#8a5a33"/>
  <rect x="572" y="412" width="8" height="56" fill="#5b3a24"/>
  <rect x="552" y="464" width="48" height="6" rx="3" fill="#5b3a24"/>
  <rect x="574" y="334" width="4" height="68" fill="#2b2521"/>
  <path d="M548 336 L604 336 L591 296 L561 296 Z" fill="#f6ead8" stroke="#d6c3aa" stroke-width="2"/>
  <rect x="592" y="388" width="14" height="14" rx="2" fill="#e3d1b8"/>

  <!-- plant -->
  <g>
    <ellipse cx="72" cy="356" rx="11" ry="40" fill="#7f9270" transform="rotate(-22 72 356)"/>
    <ellipse cx="58" cy="374" rx="9" ry="32" fill="#93a57d" transform="rotate(-50 58 374)"/>
    <ellipse cx="92" cy="352" rx="11" ry="40" fill="#93a57d" transform="rotate(16 92 352)"/>
    <ellipse cx="104" cy="376" rx="9" ry="30" fill="#7f9270" transform="rotate(48 104 376)"/>
    <ellipse cx="80" cy="336" rx="9" ry="38" fill="#6d8060"/>
  </g>
  <path d="M42 402 H116 L106 470 H52 Z" fill="#efe6da" stroke="#d6c3aa" stroke-width="3"/>

  <!-- wall frame -->
  <rect x="150" y="222" width="62" height="78" rx="4" fill="#fbf8f3" stroke="#8a5a33" stroke-width="5"/>
  <path d="M160 288 L178 256 L190 274 L198 262 L204 288 Z" fill="#c99d70"/>
  <circle cx="194" cy="242" r="6" fill="#e3b77a"/>
</svg>
