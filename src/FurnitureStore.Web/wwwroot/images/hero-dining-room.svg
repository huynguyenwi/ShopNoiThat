<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Minh họa phòng ăn với bộ bàn ghế gỗ sồi màu óc chó và đèn thả</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ebe0"/>
      <stop offset="1" stop-color="#e6d7c3"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5640"/>
      <stop offset="1" stop-color="#5c4033"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7bd" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffe7bd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- arched wall -->
  <path d="M110 472 V230 a210 210 0 0 1 420 0 V472 Z" fill="url(#wall)"/>

  <!-- pendant lamp -->
  <circle cx="320" cy="250" r="96" fill="url(#glow)"/>
  <rect x="318" y="20" width="4" height="178" fill="#2b2521"/>
  <path d="M276 236 Q276 196 320 196 Q364 196 364 236 Z" fill="#5c4033"/>
  <rect x="274" y="234" width="92" height="6" rx="3" fill="#4a3227"/>
  <ellipse cx="320" cy="242" rx="14" ry="5" fill="#ffe7bd"/>

  <!-- wall frames -->
  <rect x="150" y="214" width="62" height="78" rx="4" fill="#fbf8f3" stroke="#5c4033" stroke-width="5"/>
  <path d="M160 280 L178 248 L190 266 L198 254 L204 280 Z" fill="#c99d70"/>
  <circle cx="194" cy="234" r="6" fill="#e3b77a"/>
  <rect x="432" y="224" width="54" height="64" rx="4" fill="#fbf8f3" stroke="#5c4033" stroke-width="5"/>
  <path d="M442 276 Q459 244 476 276 Z" fill="#93a57d"/>

  <!-- floor and rug -->
  <rect x="30" y="470" width="580" height="6" rx="3" fill="#d6c3aa"/>
  <ellipse cx="320" cy="474" rx="250" ry="15" fill="#e3d1b8"/>

  <!-- chairs behind the table: backs with slats -->
  <g fill="#6b4a35">
    <rect x="222" y="284" width="56" height="12" rx="6"/>
    <rect x="224" y="284" width="8" height="70"/>
    <rect x="268" y="284" width="8" height="70"/>
    <rect x="240" y="296" width="6" height="58"/>
    <rect x="254" y="296" width="6" height="58"/>
    <rect x="362" y="284" width="56" height="12" rx="6"/>
    <rect x="364" y="284" width="8" height="70"/>
    <rect x="408" y="284" width="8" height="70"/>
    <rect x="380" y="296" width="6" height="58"/>
    <rect x="394" y="296" width="6" height="58"/>
  </g>

  <!-- chairs at the table ends, in profile -->
  <g fill="#6b4a35">
    <path d="M104 312 L114 312 L118 470 L108 470 Z"/>
    <rect x="104" y="398" width="62" height="11" rx="3"/>
    <rect x="152" y="409" width="9" height="61"/>
    <rect x="108" y="330" width="9" height="56" rx="3" transform="rotate(-4 112 358)"/>
    <path d="M536 312 L526 312 L522 470 L532 470 Z"/>
    <rect x="474" y="398" width="62" height="11" rx="3"/>
    <rect x="479" y="409" width="9" height="61"/>
    <rect x="523" y="330" width="9" height="56" rx="3" transform="rotate(4 527 358)"/>
  </g>

  <!-- dining table -->
  <rect x="168" y="352" width="304" height="16" rx="4" fill="url(#walnut)"/>
  <rect x="168" y="352" width="304" height="3" rx="1.5" fill="#8d6a52"/>
  <rect x="184" y="368" width="272" height="14" fill="#4a3227"/>
  <path d="M192 382 H208 L205 470 H196 Z" fill="#4a3227"/>
  <path d="M432 382 H448 L444 470 H435 Z" fill="#4a3227"/>

  <!-- on the table: plates, vase with flowers, fruit bowl -->
  <ellipse cx="226" cy="350" rx="22" ry="4" fill="#fbf8f3"/>
  <ellipse cx="414" cy="350" rx="22" ry="4" fill="#fbf8f3"/>
  <path d="M310 352 Q304 334 312 322 H328 Q336 334 330 352 Z" fill="#efe6da" stroke="#d6c3aa" stroke-width="2"/>
  <ellipse cx="312" cy="306" rx="6" ry="16" fill="#7f9270" transform="rotate(-24 312 306)"/>
  <ellipse cx="330" cy="304" rx="6" ry="16" fill="#93a57d" transform="rotate(20 330 304)"/>
  <circle cx="320" cy="294" r="7" fill="#e3b77a"/>
  <circle cx="306" cy="300" r="5" fill="#c27c6b"/>
  <circle cx="336" cy="296" r="5" fill="#f1e5d4"/>
  <circle cx="362" cy="341" r="6" fill="#c99a2e"/>
  <circle cx="374" cy="339" r="6" fill="#c27c6b"/>
  <path d="M350 344 H386 Q384 352 368 352 Q352 352 350 344 Z" fill="#f1e5d4"/>

  <!-- plant -->
  <g>
    <ellipse cx="582" cy="356" rx="11" ry="40" fill="#7f9270" transform="rotate(-18 582 356)"/>
    <ellipse cx="566" cy="376" rx="9" ry="30" fill="#93a57d" transform="rotate(-48 566 376)"/>
    <ellipse cx="600" cy="354" rx="11" ry="38" fill="#93a57d" transform="rotate(18 600 354)"/>
    <ellipse cx="590" cy="338" rx="9" ry="36" fill="#6d8060"/>
  </g>
  <path d="M554 402 H624 L614 470 H564 Z" fill="#efe6da" stroke="#d6c3aa" stroke-width="3"/>
</svg>
